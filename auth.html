<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinOne — 로그인</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0a0f;--bg2:#111118;--bg3:#18181f;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#f0f0f5;--text2:#8888a0;--text3:#555568;--accent:#7c6fff;--accent2:#ff8c42;--up:#00d4a0;--down:#ff5e5e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.container{width:100%;max-width:420px;}
.logo{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;text-align:center;margin-bottom:8px;}
.logo span{color:var(--accent);}
.tagline{text-align:center;color:var(--text2);font-size:14px;margin-bottom:36px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:32px;}
.tabs{display:flex;background:var(--bg3);border-radius:10px;padding:4px;margin-bottom:28px;}
.tab{flex:1;padding:9px;text-align:center;font-size:14px;cursor:pointer;border-radius:7px;color:var(--text2);transition:all 0.15s;font-family:inherit;}
.tab.active{background:var(--bg2);color:var(--text);font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,0.3);}
.form-group{margin-bottom:16px;}
.form-label{font-size:12px;color:var(--text2);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:0.5px;}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border 0.15s;}
.form-input:focus{border-color:var(--accent);}
.form-input::placeholder{color:var(--text3);}
.btn-main{width:100%;background:var(--accent);color:white;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;transition:opacity 0.15s;margin-top:8px;}
.btn-main:hover{opacity:0.88;}
.btn-main:disabled{opacity:0.5;cursor:not-allowed;}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text3);font-size:13px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.btn-social{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--text);display:flex;align-items:center;justify-content:center;gap:10px;transition:border-color 0.15s;margin-bottom:10px;}
.btn-social:hover{border-color:var(--border2);}
.error-msg{background:rgba(255,94,94,0.1);border:1px solid rgba(255,94,94,0.2);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--down);margin-bottom:16px;display:none;}
.success-msg{background:rgba(0,212,160,0.1);border:1px solid rgba(0,212,160,0.2);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--up);margin-bottom:16px;display:none;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.footer-text{text-align:center;font-size:12px;color:var(--text3);margin-top:20px;line-height:1.6;}
.footer-text a{color:var(--accent);text-decoration:none;}
/* 로그인 완료 화면 */
.logged-in{display:none;text-align:center;}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin:0 auto 16px;font-family:'Syne',sans-serif;}
.user-email{font-size:13px;color:var(--text2);margin-bottom:24px;}
.plan-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:24px;}
.plan-free{background:rgba(136,136,160,0.15);color:var(--text2);}
.plan-premium{background:linear-gradient(135deg,rgba(124,111,255,0.2),rgba(255,140,66,0.2));border:1px solid rgba(124,111,255,0.3);color:#c0b0ff;}
.btn-goto{display:block;background:var(--accent);color:white;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;text-decoration:none;margin-bottom:10px;transition:opacity 0.15s;}
.btn-goto:hover{opacity:0.88;}
.btn-logout{display:block;width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--text2);transition:all 0.15s;}
.btn-logout:hover{border-color:var(--border2);color:var(--text);}
</style>
</head>
<body>
<div class="container">
  <div class="logo">Fin<span>One</span></div>
  <div class="tagline">주식·코인 통합 분석 플랫폼</div>

  <!-- 로그인/회원가입 폼 -->
  <div class="card" id="auth-card">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">로그인</div>
      <div class="tab" onclick="switchTab('signup')">회원가입</div>
    </div>

    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>

    <!-- 로그인 폼 -->
    <div id="login-form">
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input class="form-input" id="login-email" type="email" placeholder="example@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input" id="login-pw" type="password" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn-main" id="login-btn" onclick="doLogin()">로그인</button>
      <div style="text-align:right;margin-top:10px;">
        <a href="#" onclick="showReset()" style="font-size:12px;color:var(--text3);text-decoration:none;">비밀번호 찾기</a>
      </div>
    </div>

    <!-- 회원가입 폼 -->
    <div id="signup-form" style="display:none;">
      <div class="form-group">
        <label class="form-label">닉네임</label>
        <input class="form-input" id="signup-name" type="text" placeholder="닉네임 입력">
      </div>
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input class="form-input" id="signup-email" type="email" placeholder="example@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input" id="signup-pw" type="password" placeholder="8자 이상">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호 확인</label>
        <input class="form-input" id="signup-pw2" type="password" placeholder="비밀번호 재입력" onkeydown="if(event.key==='Enter')doSignup()">
      </div>
      <button class="btn-main" id="signup-btn" onclick="doSignup()">회원가입</button>
    </div>

    <!-- 비밀번호 재설정 폼 -->
    <div id="reset-form" style="display:none;">
      <div class="form-group">
        <label class="form-label">가입한 이메일</label>
        <input class="form-input" id="reset-email" type="email" placeholder="example@email.com">
      </div>
      <button class="btn-main" onclick="doReset()">재설정 메일 발송</button>
      <div style="text-align:center;margin-top:12px;">
        <a href="#" onclick="switchTab('login')" style="font-size:13px;color:var(--text2);text-decoration:none;">← 로그인으로 돌아가기</a>
      </div>
    </div>

    <div class="divider">또는</div>

    <button class="btn-social" onclick="doGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google로 계속하기
    </button>

    <div class="footer-text">
      가입 시 <a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의합니다.
    </div>
  </div>

  <!-- 로그인 완료 화면 -->
  <div class="card logged-in" id="logged-in-card">
    <div class="avatar" id="user-avatar">?</div>
    <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:600;margin-bottom:4px;" id="user-name">사용자</div>
    <div class="user-email" id="user-email-display"></div>
    <div class="plan-badge plan-free" id="plan-badge">무료 플랜</div>

    <div style="background:var(--bg3);border-radius:12px;padding:16px;margin-bottom:20px;text-align:left;">
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px;">무료 플랜 기능</div>
      <div style="font-size:13px;display:flex;flex-direction:column;gap:7px;">
        <div style="color:var(--up);">✓ 실시간 코인/주식 시세</div>
        <div style="color:var(--up);">✓ 기본 포트폴리오 (로컬)</div>
        <div style="color:var(--up);">✓ 뉴스 피드</div>
        <div style="color:var(--text3);">✗ AI 분석 (프리미엄)</div>
        <div style="color:var(--text3);">✗ 클라우드 포트폴리오 저장 (프리미엄)</div>
        <div style="color:var(--text3);">✗ 무제한 가격 알림 (프리미엄)</div>
      </div>
    </div>

    <a href="finone.html" class="btn-goto">🚀 앱 시작하기</a>
    <button style="width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;margin-bottom:10px;" onclick="alert('결제 기능 준비 중!')">✨ 프리미엄 업그레이드</button>
    <button class="btn-logout" onclick="doLogout()">로그아웃</button>
  </div>
</div>

<script>
// ── Supabase 설정 ──────────────────────────────────
// 👇 여기에 본인 Supabase 프로젝트 키 입력
const SUPABASE_URL = 'https://dubjhqlapwyrianyzwuy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1YmpocWxhcHd5cmlhbnl6d3V5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTkwNjMsImV4cCI6MjA5NDQzNTA2M30.T3KnLdQ25UObsHhKveQIX4jN8IPQXVkUJF-zG2t8qDw';

// Supabase 클라이언트 초기화
const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── UI 유틸 ──────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('success-msg').style.display = 'none';
}
function showSuccess(msg) {
  const el = document.getElementById('success-msg');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('error-msg').style.display = 'none';
}
function clearMsg() {
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('success-msg').style.display = 'none';
}
function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (loading) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>처리 중...'; }
  else { btn.disabled = false; }
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='signup'&&i===1)));
  document.getElementById('login-form').style.display = tab==='login' ? 'block' : 'none';
  document.getElementById('signup-form').style.display = tab==='signup' ? 'block' : 'none';
  document.getElementById('reset-form').style.display = 'none';
  clearMsg();
}
function showReset() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('reset-form').style.display = 'block';
  clearMsg();
}

// ── 로그인 ────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  if (!email || !pw) { showError('이메일과 비밀번호를 입력해주세요'); return; }
  setLoading('login-btn', true);
  clearMsg();
  try {
    if (!_sb) throw new Error('Supabase 키를 설정해주세요 (SUPABASE_URL, SUPABASE_ANON_KEY)');
    const { data, error } = await _sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    showLoggedIn(data.user);
  } catch(e) {
    showError(e.message === 'Invalid login credentials' ? '이메일 또는 비밀번호가 올바르지 않습니다' : e.message);
    document.getElementById('login-btn').disabled = false;
    document.getElementById('login-btn').textContent = '로그인';
  }
}

// ── 회원가입 ──────────────────────────────────────
async function doSignup() {
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const pw = document.getElementById('signup-pw').value;
  const pw2 = document.getElementById('signup-pw2').value;
  if (!name || !email || !pw) { showError('모든 항목을 입력해주세요'); return; }
  if (pw.length < 8) { showError('비밀번호는 8자 이상이어야 합니다'); return; }
  if (pw !== pw2) { showError('비밀번호가 일치하지 않습니다'); return; }
  setLoading('signup-btn', true);
  clearMsg();
  try {
    if (!_sb) throw new Error('Supabase 키를 설정해주세요');
    const { data, error } = await _sb.auth.signUp({
      email, password: pw,
      options: { data: { display_name: name } }
    });
    if (error) throw error;
    if (data.user?.identities?.length === 0) { showError('이미 가입된 이메일입니다'); }
    else { showSuccess('✓ 가입 완료! 이메일 인증 후 로그인해주세요 (스팸 폴더도 확인)'); }
  } catch(e) {
    showError(e.message);
  }
  document.getElementById('signup-btn').disabled = false;
  document.getElementById('signup-btn').textContent = '회원가입';
}

// ── 구글 로그인 ───────────────────────────────────
async function doGoogleLogin() {
  try {
    if (!_sb) throw new Error('Supabase 키를 설정해주세요');
    const { error } = await _sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.href }
    });
    if (error) throw error;
  } catch(e) { showError(e.message); }
}

// ── 비밀번호 재설정 ───────────────────────────────
async function doReset() {
  const email = document.getElementById('reset-email').value.trim();
  if (!email) { showError('이메일을 입력해주세요'); return; }
  try {
    if (!_sb) throw new Error('Supabase 키를 설정해주세요');
    const { error } = await _sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html'
    });
    if (error) throw error;
    showSuccess('✓ 재설정 메일을 발송했습니다. 스팸 폴더도 확인해주세요!');
  } catch(e) { showError(e.message); }
}

// ── 로그아웃 ──────────────────────────────────────
async function doLogout() {
  if (supabase) await _sb.auth.signOut();
  document.getElementById('logged-in-card').style.display = 'none';
  document.getElementById('auth-card').style.display = 'block';
  switchTab('login');
}

// ── 로그인 완료 화면 ──────────────────────────────
function showLoggedIn(user) {
  document.getElementById('auth-card').style.display = 'none';
  document.getElementById('logged-in-card').style.display = 'block';
  const name = user.user_metadata?.display_name || user.email.split('@')[0];
  document.getElementById('user-avatar').textContent = name[0].toUpperCase();
  document.getElementById('user-name').textContent = name;
  document.getElementById('user-email-display').textContent = user.email;
  // 프리미엄 여부 체크 (나중에 DB에서 가져오기)
  const isPremium = user.user_metadata?.is_premium || false;
  const badge = document.getElementById('plan-badge');
  badge.textContent = isPremium ? '✨ 프리미엄' : '무료 플랜';
  badge.className = 'plan-badge ' + (isPremium ? 'plan-premium' : 'plan-free');
}

// ── 자동 로그인 체크 ──────────────────────────────
async function checkSession() {
  if (!_sb) return;
  const { data } = await _sb.auth.getSession();
  if (data.session) showLoggedIn(data.session.user);
  // 구글 로그인 리다이렉트 처리
  _sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) showLoggedIn(session.user);
  });
}
checkSession();
</script>
</body>
</html>
